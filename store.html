<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>オンラインストア｜博多らーめん 紅一</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-hero" data-bg="photo-1552611052-33e04de081de">
      <div><span class="en">ONLINE STORE</span><h1>オンラインストア</h1></div>
    </section>

    <div class="container">
      <p class="breadcrumb"><a href="index.html">トップ</a> ＞ オンラインストア</p>
    </div>

    <section class="page-body">
      <div class="container">
        <p class="lead">お店の味をそのまま、ご自宅の食卓へ。<br>税込5,000円以上のご注文で送料無料。</p>

        <div class="store-grid">
          <article class="product">
            <img data-img="photo-1591814468924-caf88d1232e1" data-w="500" alt="白丸 3食セット">
            <div class="body"><h3>白丸 3食セット</h3><p class="price">¥2,160</p><button>カートに入れる</button></div>
          </article>
          <article class="product">
            <img data-img="photo-1557872943-16a5ac26437e" data-w="500" alt="赤丸 3食セット">
            <div class="body"><h3>赤丸 3食セット <span class="tag fill">NEW</span></h3><p class="price">¥2,380</p><button>カートに入れる</button></div>
          </article>
          <article class="product">
            <img data-img="photo-1614563637806-1d0e645e0940" data-w="500" alt="紅蓮つけ麺 2食">
            <div class="body"><h3>紅蓮つけ麺 2食</h3><p class="price">¥1,980</p><button>カートに入れる</button></div>
          </article>
          <article class="product">
            <img data-img="photo-1623341214825-9f4f963727da" data-w="500" alt="食べ比べギフト">
            <div class="body"><h3>食べ比べギフト 6食</h3><p class="price">¥4,500</p><button>カートに入れる</button></div>
          </article>
          <article class="product">
            <img data-img="photo-1552611052-33e04de081de" data-w="500" alt="まぜそば 3食">
            <div class="body"><h3>紅一まぜそば 3食</h3><p class="price">¥2,280</p><button>カートに入れる</button></div>
          </article>
          <article class="product">
            <img data-img="photo-1569718212165-3a8278d5f624" data-w="500" alt="海老塩 3食">
            <div class="body"><h3>海老塩らーめん 3食</h3><p class="price">¥2,380</p><button>カートに入れる</button></div>
          </article>
          <article class="product">
            <img data-img="photo-1526318896980-cf78c088247c" data-w="500" alt="替玉 5玉">
            <div class="body"><h3>替玉（極細麺）5玉</h3><p class="price">¥780</p><button>カートに入れる</button></div>
          </article>
          <article class="product">
            <img data-img="photo-1617093727343-374698b1b08d" data-w="500" alt="特製辛味噌">
            <div class="body"><h3>特製 赤丸辛味噌</h3><p class="price">¥650</p><button>カートに入れる</button></div>
          </article>
        </div>
      </div>
    </section>
    <div class="cart-badge">カート 0点</div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/main.js?v=3"></script>
</body>
</html>
